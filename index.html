<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Routine & Circuit Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
      margin-top: 6px;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .routine-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .routine-badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .exercise-item {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .exercise-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sets-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .set-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .set-number {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 50px;
    }

    .set-info {
      flex-grow: 1;
      font-size: 0.9rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .set-row.completed {
      border-color: var(--success);
      opacity: 0.6;
    }

    .circuit-tracker {
      background: #0369a1;
      color: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .circuit-tracker h3 {
      font-size: 1rem;
    }

    .circuit-btn {
      background: white;
      color: #0369a1;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .circuit-btn:hover {
      background: #e0f2fe;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Workout Routine Tracker</h1>
      <p>Configure routines, circuits, and track completed sets</p>
    </header>

    <!-- Configure Form -->
    <div class="card">
      <h2>Add Exercise to Routine</h2>
      <form id="exercise-form">
        <div class="form-group">
          <label for="exercise-name">Exercise Name</label>
          <input type="text" id="exercise-name" placeholder="e.g., Push-ups, Squats, Bench Press" required />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="target-sets">Target Sets</label>
            <input type="number" id="target-sets" min="1" max="20" value="3" required />
          </div>
          <div class="form-group">
            <label for="target-reps">Target Reps / Duration</label>
            <input type="text" id="target-reps" placeholder="e.g., 12 reps or 45 sec" required />
          </div>
        </div>

        <div class="form-group">
          <label for="routine-type">Mode / Routine Type</label>
          <select id="routine-type">
            <option value="Standard">Standard Routine (Set by Set)</option>
            <option value="Circuit">Circuit Mode (Round by Round)</option>
          </select>
        </div>

        <button type="submit" class="btn">Add Exercise</button>
      </form>
    </div>

    <!-- Active Workout Tracker -->
    <div class="card">
      <div class="routine-header">
        <h2>Active Workout</h2>
        <span id="mode-badge" class="routine-badge">Standard</span>
      </div>

      <!-- Circuit Round Tracker (Only shown in Circuit Mode) -->
      <div id="circuit-header" class="circuit-tracker" style="display: none;">
        <div>
          <h3>Circuit Progress</h3>
          <p id="circuit-status">Round 1</p>
        </div>
        <button id="next-round-btn" class="circuit-btn">Complete Round</button>
      </div>

      <!-- Exercise List -->
      <div id="exercise-list">
        <div class="empty-state">No exercises added yet. Add one above!</div>
      </div>
    </div>
  </div>

  <script>
    const exercises = [];
    let currentMode = "Standard";
    let completedCircuitRounds = 0;

    const form = document.getElementById('exercise-form');
    const exerciseList = document.getElementById('exercise-list');
    const modeBadge = document.getElementById('mode-badge');
    const circuitHeader = document.getElementById('circuit-header');
    const circuitStatus = document.getElementById('circuit-status');
    const nextRoundBtn = document.getElementById('next-round-btn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('exercise-name').value;
      const targetSets = parseInt(document.getElementById('target-sets').value);
      const targetReps = document.getElementById('target-reps').value;
      const mode = document.getElementById('routine-type').value;

      currentMode = mode;
      modeBadge.textContent = mode;

      if (mode === "Circuit") {
        circuitHeader.style.display = 'flex';
      } else {
        circuitHeader.style.display = 'none';
      }

      const exercise = {
        id: Date.now(),
        name,
        targetSets,
        targetReps,
        sets: Array.from({ length: targetSets }, () => ({ completed: false }))
      };

      exercises.push(exercise);
      form.reset();
      document.getElementById('target-sets').value = 3;
      render();
    });

    function toggleSet(exerciseId, setIndex) {
      const exercise = exercises.find(ex => ex.id === exerciseId);
      if (exercise) {
        exercise.sets[setIndex].completed = !exercise.sets[setIndex].completed;
        render();
      }
    }

    function removeExercise(exerciseId) {
      const index = exercises.findIndex(ex => ex.id === exerciseId);
      if (index !== -1) {
        exercises.splice(index, 1);
        render();
      }
    }

    nextRoundBtn.addEventListener('click', () => {
      completedCircuitRounds++;
      exercises.forEach(ex => {
        ex.sets.forEach((set, idx) => {
          if (idx < completedCircuitRounds && idx < ex.sets.length) {
            set.completed = true;
          }
        });
      });
      circuitStatus.textContent = `Completed Rounds: ${completedCircuitRounds}`;
      render();
    });

    function render() {
      if (exercises.length === 0) {
        exerciseList.innerHTML = '<div class="empty-state">No exercises added yet. Add one above!</div>';
        return;
      }

      exerciseList.innerHTML = '';

      exercises.forEach(ex => {
        const completedCount = ex.sets.filter(s => s.completed).length;
        const item = document.createElement('div');
        item.className = 'exercise-item';

        let setsHTML = '';
        ex.sets.forEach((set, idx) => {
          setsHTML += `
            <div class="set-row ${set.completed ? 'completed' : ''}">
              <span class="set-number">Set ${idx + 1}</span>
              <span class="set-info">${ex.targetReps}</span>
              <label class="checkbox-container">
                <input type="checkbox" ${set.completed ? 'checked' : ''} onchange="toggleSet(${ex.id}, ${idx})" />
              </label>
            </div>
          `;
        });

        item.innerHTML = `
          <div class="exercise-title">
            <span>${ex.name} (${completedCount}/${ex.targetSets} Sets Done)</span>
            <button class="btn-danger" onclick="removeExercise(${ex.id})">Delete</button>
          </div>
          <div class="sets-container">
            ${setsHTML}
          </div>
        `;

        exerciseList.appendChild(item);
      });
    }
  </script>
</body>
</html>
