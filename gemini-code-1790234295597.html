<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Routine Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .header h1 { margin: 0; font-size: 1.4rem; display: flex; align-items: center; gap: 6px; }
    .btn-add {
      background: var(--accent-blue);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .workout-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 18px 20px;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }
    .workout-title { font-size: 1.2rem; font-weight: bold; }
    .workout-info { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-content h2 { margin: 0 0 8px 0; font-size: 1.2rem; }
    .modal-content label { font-size: 0.85rem; color: var(--text-sub); }
    .modal-content input {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }
    .modal-btns { display: flex; gap: 8px; margin-top: 12px; }

    /* Set Checklist Styling */
    .day-badge {
      display: inline-block;
      background-color: var(--accent-blue);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .target-box {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .set-list { display: flex; flex-direction: column; gap: 10px; }
    .set-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
    }
    .set-item.done { background-color: #064e3b; opacity: 0.7; }
    .set-item.done .set-reps { text-decoration: line-through; }
    .checkbox {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid #64748b;
      display: flex; align-items: center; justify-content: center;
    }
    .set-item.done .checkbox {
      border-color: var(--accent-green);
      background-color: var(--accent-green);
    }
    .set-item.done .checkbox::after { content: '✓'; color: white; font-size: 14px; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: bold; color: white;
      background-color: var(--accent-blue); cursor: pointer; margin-top: 12px;
    }
    .btn-sub { background-color: var(--border-color); color: #cbd5e1; font-size: 0.85rem; }
    .btn-danger { background-color: #ef4444; }
    .back-btn { background: none; border: none; color: var(--accent-blue); font-size: 1rem; cursor: pointer; padding: 0; }
    .btn-rename { background: none; border: none; color: var(--text-sub); font-size: 1rem; cursor: pointer; padding: 4px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. Main Workout List View -->
  <div id="viewList">
    <div class="header">
      <h1>My Routines</h1>
      <button class="btn-add" onclick="openModal()">+</button>
    </div>
    <div id="workoutList"></div>
  </div>

  <!-- 2. Selected Workout Detail View -->
  <div id="viewDetail" style="display: none;">
    <div class="header">
      <button class="back-btn" onclick="showList()">◀ Back</button>
      <h1>
        <span id="detailTitle">Workout Name</span>
        <button class="btn-rename" onclick="renameWorkout()" title="Rename Workout">✏️</button>
      </h1>
      <div></div>
    </div>
    <div class="card" id="detailCard"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-sub" onclick="prevDay()">◀ Previous Day</button>
      <button class="btn btn-sub btn-danger" onclick="deleteWorkout()">Delete</button>
    </div>
  </div>
</div>

<!-- Add Workout Modal -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h2>Add New Workout</h2>
    <label>Exercise Name (e.g., Pull-ups, Push-ups)</label>
    <input type="text" id="inputName" placeholder="e.g., Pull-ups">
    <label>Starting Reps for 1st Set (Default: 5)</label>
    <input type="number" id="inputStart" value="5" min="1">
    <label>Total Number of Sets (Default: 5)</label>
    <input type="number" id="inputSets" value="5" min="1" max="10">
    <div class="modal-btns">
      <button class="btn btn-sub" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="addWorkout()">Create</button>
    </div>
  </div>
</div>

<script>
  let workouts = JSON.parse(localStorage.getItem('my_workouts')) || [];
  let currentWorkoutId = null;

  function saveData() {
    localStorage.setItem('my_workouts', JSON.stringify(workouts));
  }

  function renderList() {
    const listEl = document.getElementById('workoutList');
    if (workouts.length === 0) {
      listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); margin-top: 40px;">Tap the + button above<br>to add your first workout!</p>';
      return;
    }
    listEl.innerHTML = workouts.map(w => `
      <div class="workout-item" onclick="openDetail('${w.id}')">
        <div>
          <div class="workout-title">${w.name}</div>
          <div class="workout-info">Day ${w.day} · Starts at ${w.startReps} reps, ${w.setCount} sets</div>
        </div>
        <div style="color: var(--accent-blue); font-size: 1.2rem;">➔</div>
      </div>
    `).join('');
  }

  function openModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('addModal').style.display = 'none'; }

  function addWorkout() {
    const name = document.getElementById('inputName').value.trim();
    const startReps = parseInt(document.getElementById('inputStart').value) || 5;
    const setCount = parseInt(document.getElementById('inputSets').value) || 5;

    if (!name) { alert('Please enter an exercise name!'); return; }

    const newWorkout = {
      id: Date.now().toString(),
      name: name,
      startReps: startReps,
      setCount: setCount,
      day: 1,
      completedSets: new Array(setCount).fill(false)
    };

    workouts.push(newWorkout);
    saveData();
    closeModal();
    document.getElementById('inputName').value = '';
    renderList();
  }

  function openDetail(id) {
    currentWorkoutId = id;
    document.getElementById('viewList').style.display = 'none';
    document.getElementById('viewDetail').style.display = 'block';
    renderDetail();
  }

  function showList() {
    document.getElementById('viewList').style.display = 'block';
    document.getElementById('viewDetail').style.display = 'none';
    renderList();
  }

  function renameWorkout() {
    const w = workouts.find(item => item.id === currentWorkoutId);
    if (!w) return;
    
    const newName = prompt("Enter a new workout name:", w.name);
    if (newName && newName.trim() !== "") {
      w.name = newName.trim();
      saveData();
      renderDetail();
    }
  }

  function getRepsForDay(w) {
    if (w.day % 6 === 0) return null; // Rest Day
    
    const cycle = Math.floor((w.day - 1) / 6);
    const baseStart = w.startReps + cycle;
    const step = (w.day - 1) % 6;

    let reps = [];
    for (let i = 0; i < w.setCount; i++) {
      reps.push(Math.max(1, baseStart - i));
    }
    for (let i = 0; i < step; i++) {
      let idx = w.setCount - 1 - i;
      if (idx >= 0) reps[idx] += 1;
    }
    return reps;
  }

  function renderDetail() {
    const w = workouts.find(item => item.id === currentWorkoutId);
    if (!w) return;

    document.getElementById('detailTitle').innerText = w.name;
    const card = document.getElementById('detailCard');
    const reps = getRepsForDay(w);

    if (reps === null) {
      card.innerHTML = `
        <div style="text-align:center; padding: 20px 0;">
          <div style="font-size:2.5rem;">🛌</div>
          <h2>Day ${w.day} - Rest Day</h2>
          <p style="color:var(--text-sub);">Muscle recovery day. Get plenty of rest!</p>
          <button class="btn" onclick="completeDay()" style="background:var(--accent-green);">Skip to Next Day</button>
        </div>
      `;
    } else {
      const totalReps = reps.reduce((a, b) => a + b, 0);
      let setListHtml = reps.map((rep, idx) => `
        <div class="set-item ${w.completedSets[idx] ? 'done' : ''}" onclick="toggleSet(${idx})">
          <span>Set ${idx + 1}: <strong class="set-reps">${rep} reps</strong></span>
          <div class="checkbox"></div>
        </div>
      `).join('');

      card.innerHTML = `
        <span class="day-badge">Day ${w.day}</span>
        <div class="target-box">
          <span style="font-weight:bold;">Target Sets</span>
          <span style="color:var(--accent-green); font-weight:bold;">Total ${totalReps} reps</span>
        </div>
        <div class="set-list">${setListHtml}</div>
        <button class="btn" onclick="completeDay()">Complete Workout!</button>
      `;
    }
  }

  function toggleSet(index) {
    const w = workouts.find(item => item.id === currentWorkoutId);
    w.completedSets[index] = !w.completedSets[index];
    saveData();
    renderDetail();
  }

  function completeDay() {
    const w = workouts.find(item => item.id === currentWorkoutId);
    w.day++;
    w.completedSets = new Array(w.setCount).fill(false);
    saveData();
    renderDetail();
  }

  function prevDay() {
    const w = workouts.find(item => item.id === currentWorkoutId);
    if (w.day > 1) {
      w.day--;
      w.completedSets = new Array(w.setCount).fill(false);
      saveData();
      renderDetail();
    }
  }

  function deleteWorkout() {
    if (confirm("Are you sure you want to delete this workout routine?")) {
      workouts = workouts.filter(item => item.id !== currentWorkoutId);
      saveData();
      showList();
    }
  }

  renderList();
</script>
</body>
</html>
